    {% extends "base.html" %}

    {% block content %}

    <h2>Редактировать пользователя</h2>

    <form method="post">
        <input name="username" value="{{ user.username }}">
        <input name="email" value="{{ user.email }}">
        <button type="submit">Сохранить</button>
    </form>

    <a href="{{ url_for('users') }}">Назад</a>

    {% endblock %}
